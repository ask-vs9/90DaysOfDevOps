[SERVICE]
    Flush        1
    Log_Level    info
    Daemon       off

[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224
    Tag           docker.*

[OUTPUT]
    Name        loki
    Match       *
    Host        loki
    Port        3100
    Uri         /loki/api/v1/push
    Labels      job=docker,source=day-75
    Line_Format json