---
- name: Configure web servers
  hosts: web
  become: true
  tasks:
    - name: Ensure Nginx is installed and running
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Start Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

- name: Configure application servers
  hosts: app
  become: true
  tasks:
    - name: Install curl on application servers
      ansible.builtin.apt:
        name: curl
        state: present

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/day69-app
        state: directory
        mode: '0755'

- name: Configure database servers
  hosts: db
  become: true
  tasks:
    - name: Install MySQL client
      ansible.builtin.apt:
        name: mysql-client
        state: present

    - name: Create database configuration directory
      ansible.builtin.file:
        path: /opt/day69-db
        state: directory
        mode: '0755'
